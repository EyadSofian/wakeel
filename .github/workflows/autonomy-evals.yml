name: autonomy evals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
    paths:
      - packages/autonomy/**
      - packages/llm/**
      - tools/evals-autonomy.ts

permissions:
  contents: read

concurrency:
  group: autonomy-evals
  cancel-in-progress: false

jobs:
  adherence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated test sandbox
        run: |
          env -i PATH="$PATH" NODE_ENV=test SANDBOX_POOL_SIZE=2 pnpm --filter @wakeel/sandbox start > /tmp/sandbox.log 2>&1 &
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4300/health/ready
      - name: Evaluate configured candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
        run: pnpm evals:autonomy --output "$RUNNER_TEMP/adherence-reports"
      - name: Preserve completed reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, MIT
        with:
          name: autonomy-adherence
          path: ${{ runner.temp }}/adherence-reports/*.json
          if-no-files-found: warn
          retention-days: 30
