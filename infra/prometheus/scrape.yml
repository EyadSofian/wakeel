global:
  scrape_interval: 15s
scrape_configs:
  - job_name: wakeel-api
    static_configs:
      - targets: ["api:3000"]
  - job_name: wakeel-worker
    static_configs:
      - targets: ["worker:9100"]
  - job_name: wakeel-sandbox
    static_configs:
      - targets: ["sandbox:4300"]
  - job_name: wakeel-egress
    static_configs:
      - targets: ["egress:4400"]
