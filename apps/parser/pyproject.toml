[project]
name = "wakeel-parser"
version = "0.0.0"
description = "Converts uploaded documents to structured Markdown (task 8.2, architecture §8.1). No network."
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.150.1",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "torch==2.15.0",
  "torchvision==0.29.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wakeel_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The parser has no GPU. PyPI's Linux defaults pull proprietary CUDA runtimes that fail our licence gate.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
